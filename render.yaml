services:
  - type: web
    name: ai-qr-printing-cloud
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir cloud_server --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-printing-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_GATEWAY_PROVIDER
        sync: false
      - key: PAYMENT_MODE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_GATEWAY_KEY_ID
        sync: false
      - key: PAYMENT_GATEWAY_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

databases:
  - name: ai-printing-db
    region: oregon
    plan: free

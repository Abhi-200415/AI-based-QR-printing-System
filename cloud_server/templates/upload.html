<!DOCTYPE html>
<html>
<head>
    <title>AI Smart Printing - Upload</title>
</head>

<body>

<h2>Upload Documents for Printing</h2>

<p>
    Job ID: {{ job_id }}
</p>

<form id="uploadForm" enctype="multipart/form-data">

    <input
        type="file"
        name="files"
        id="files"
        multiple
        required
    >

    <br><br>

    <button type="submit">
        Upload Documents
    </button>

</form>

<p id="message"></p>

<script>

const form = document.getElementById("uploadForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const files =
        document.getElementById("files").files;

    if (files.length === 0) {
        return;
    }

    const formData = new FormData();

    for (const file of files) {
        formData.append("files", file);
    }

    document.getElementById("message").innerText =
        "Uploading...";

    try {

        const response = await fetch(
            "/upload/{{ job_id }}",
            {
                method: "POST",
                body: formData
            }
        );

        const result = await response.json();

        if (!response.ok) {

            document.getElementById("message").innerText =
                result.detail || "Upload failed.";

            return;
        }

        if (result.uploaded_files && result.uploaded_files.length > 0) {

            const fileIds = result.uploaded_files.map(f => f.file_id);
            localStorage.setItem("pending_file_ids", JSON.stringify(fileIds));
            
            const firstFileId = fileIds.shift();
            localStorage.setItem("pending_file_ids", JSON.stringify(fileIds));

            window.location.href = "/file/settings-page/" + firstFileId;

        } else {

            document.getElementById("message").innerText =
                "No files were processed.";

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
            "Unable to connect to server.";

    }

});

</script>

</body>
</html>

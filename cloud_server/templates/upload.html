<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Documents - AI Smart Printing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .upload-container {
            width: 100%;
            max-width: 520px;
        }
        .upload-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .dropzone-box {
            border: 2px dashed var(--border-light);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 36px 20px;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin: 20px 0;
        }
        .dropzone-box:hover, .dropzone-box.dragover {
            border-color: var(--accent);
            background: var(--accent-subtle);
        }
        .file-item-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            text-align: left;
        }
        .step-progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border-light);
        }
        .step-dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

<div class="upload-container">
    <div class="upload-card">
        <div class="step-progress-bar">
            <div class="step-dot active" title="Upload"></div>
            <div class="step-dot" title="Print Settings"></div>
            <div class="step-dot" title="Payment"></div>
            <div class="step-dot" title="Live Print"></div>
        </div>

        <div style="font-size: 38px; margin-bottom: 8px;">📄</div>
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 4px;">Upload Print Documents</h2>
        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;">
            Print Session ID: <code style="color: #a5b4fc; background: var(--accent-subtle); padding: 2px 6px; border-radius: 4px;">{{ job_id[:8] }}...</code>
        </div>

        <form id="uploadForm">
            <div class="dropzone-box" id="dropzone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 42px; margin-bottom: 10px;">☁️</div>
                <div style="font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 4px;">
                    Tap or Drop Files Here
                </div>
                <div style="font-size: 12.5px; color: var(--text-muted);">
                    Supports PDF, DOCX, TXT, PNG, JPG (Max 50MB)
                </div>
            </div>
            <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.png,.jpg,.jpeg" style="display: none;">

            <div id="fileList" style="margin-bottom: 20px; display: none;"></div>

            <button type="submit" class="btn btn-lg" id="uploadBtn" style="width: 100%;" disabled>
                Upload & Configure Settings →
            </button>
        </form>

        <div id="uploadStatusMsg" style="margin-top: 16px; font-size: 13.5px; display: none;"></div>
    </div>
</div>

<script>
const jobId = "{{ job_id }}";
const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const fileList = document.getElementById("fileList");
const uploadBtn = document.getElementById("uploadBtn");
const statusMsg = document.getElementById("uploadStatusMsg");

function updateFileList() {
    const files = fileInput.files;
    if (files.length === 0) {
        fileList.style.display = "none";
        uploadBtn.disabled = true;
        return;
    }
    fileList.style.display = "block";
    uploadBtn.disabled = false;
    fileList.innerHTML = Array.from(files).map(f => `
        <div class="file-item-card">
            <div style="font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px;">
                📑 ${f.name}
            </div>
            <div style="font-size: 12px; color: var(--text-muted);">
                ${(f.size / (1024*1024)).toFixed(2)} MB
            </div>
        </div>
    `).join("");
}

fileInput.addEventListener("change", updateFileList);

dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        updateFileList();
    }
});

document.getElementById("uploadForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const files = fileInput.files;
    if (files.length === 0) return;

    const formData = new FormData();
    for (const f of files) {
        formData.append("files", f);
    }

    uploadBtn.disabled = true;
    uploadBtn.innerText = "Analyzing & Uploading Documents...";
    statusMsg.style.display = "block";
    statusMsg.style.color = "#a5b4fc";
    statusMsg.innerText = "Processing document pages & securing with AES-256...";

    try {
        const response = await fetch(`/upload/${jobId}`, {
            method: "POST",
            body: formData
        });
        const result = await response.json();

        if (!response.ok) {
            statusMsg.style.color = "#f87171";
            statusMsg.innerText = result.detail || "Upload failed. Please check your files.";
            uploadBtn.disabled = false;
            uploadBtn.innerText = "Upload & Configure Settings →";
            return;
        }

        if (result.uploaded_files && result.uploaded_files.length > 0) {
            const fileIds = result.uploaded_files.map(f => f.file_id);
            const firstFileId = fileIds.shift();
            localStorage.setItem("pending_file_ids", JSON.stringify(fileIds));
            sessionStorage.setItem("total_files", result.uploaded_files.length);
            statusMsg.style.color = "#34d399";
            statusMsg.innerText = "✓ Upload successful! Opening print options...";
            setTimeout(() => {
                window.location.href = `/file/settings-page/${firstFileId}`;
            }, 400);
        } else {
            statusMsg.style.color = "#f87171";
            statusMsg.innerText = "No files were processed.";
            uploadBtn.disabled = false;
        }
    } catch (err) {
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "Server connection error during upload.";
        uploadBtn.disabled = false;
        uploadBtn.innerText = "Upload & Configure Settings →";
    }
});
</script>

</body>
</html>

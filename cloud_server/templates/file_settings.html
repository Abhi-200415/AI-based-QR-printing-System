<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Settings - AI Smart Printing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .settings-container {
            width: 100%;
            max-width: 520px;
        }
        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
        }
        .file-manifest-pill {
            background: var(--accent-subtle);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
        }
        .step-progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border-light);
        }
        .step-dot.done {
            background: var(--success);
        }
        .step-dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

<div class="settings-container">
    <div class="settings-card">
        <div class="step-progress-bar">
            <div class="step-dot done" title="Upload"></div>
            <div class="step-dot active" title="Print Settings"></div>
            <div class="step-dot" title="Payment"></div>
            <div class="step-dot" title="Live Print"></div>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 4px;">Configure Print Options</h2>
            <div id="fileProgress" style="font-size: 13px; color: var(--text-muted);"></div>
        </div>

        <div class="file-manifest-pill">
            <div style="font-weight: 600; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px;">
                📑 {{ file_name }}
            </div>
            <span class="badge" style="background: var(--accent); color: white;">
                {{ page_count }} Page(s)
            </span>
        </div>

        <form id="settingsForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">Copies</label>
                    <input type="number" id="copies" class="form-control" value="1" min="1" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">Paper Size</label>
                    <select id="paper_size" class="form-select">
                        <option value="A4" selected>A4 Standard</option>
                        <option value="A3">A3 Large</option>
                        <option value="LEGAL">Legal</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">Orientation</label>
                    <select id="orientation" class="form-select">
                        <option value="Portrait" selected>Portrait</option>
                        <option value="Landscape">Landscape</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">Color Mode</label>
                    <select id="print_type" class="form-select">
                        <option value="BW" selected>Black & White</option>
                        <option value="COLOR">Full Color</option>
                        <option value="MIXED">Mixed (Selective)</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 13.5px;">
                    <input type="checkbox" id="duplex" style="width: 18px; height: 18px; accent-color: var(--accent);">
                    <span>Print Both Sides (Duplex / 2-Sided)</span>
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">Page Selection (Optional)</label>
                <input type="text" id="page_ranges" class="form-control" placeholder="e.g. 1-5, 8, 10 (Leave blank for all pages)">
            </div>

            <div class="form-group" id="mixedSection" style="display: none;">
                <label class="form-label">Color Pages Range (For Mixed Mode)</label>
                <input type="text" id="color_page_ranges" class="form-control" placeholder="e.g. 2, 4, 7">
            </div>

            <button type="submit" class="btn btn-lg" id="saveBtn" style="width: 100%; margin-top: 10px;">
                Save & Proceed to Order Summary →
            </button>
        </form>

        <div id="settingsStatusMsg" style="margin-top: 14px; font-size: 13.5px; text-align: center; display: none;"></div>
    </div>
</div>

<script>
const fileId = "{{ file_id }}";

const pending = JSON.parse(localStorage.getItem("pending_file_ids") || "[]");
const grandTotal = parseInt(sessionStorage.getItem("total_files") || (pending.length + 1));
const currentIdx = grandTotal - pending.length;
if (grandTotal > 1) {
    document.getElementById("fileProgress").innerText = `Configuring document ${currentIdx} of ${grandTotal}`;
}

const printTypeSelect = document.getElementById("print_type");
const mixedSection = document.getElementById("mixedSection");
printTypeSelect.addEventListener("change", function() {
    mixedSection.style.display = (this.value === "MIXED") ? "block" : "none";
});

const statusMsg = document.getElementById("settingsStatusMsg");
function showStatus(msg, isError = false) {
    statusMsg.innerText = msg;
    statusMsg.style.color = isError ? "#f87171" : "#a5b4fc";
    statusMsg.style.display = "block";
}

document.getElementById("settingsForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.innerText = "Calculating pricing rates...";

    const data = {
        copies: parseInt(document.getElementById("copies").value) || 1,
        paper_size: document.getElementById("paper_size").value,
        orientation: document.getElementById("orientation").value,
        print_type: document.getElementById("print_type").value,
        duplex: document.getElementById("duplex").checked,
        page_ranges: document.getElementById("page_ranges").value.trim() || null,
        color_page_ranges: document.getElementById("color_page_ranges").value.trim() || null
    };

    try {
        const response = await fetch(`/file/${fileId}/settings`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        if (!response.ok) {
            showStatus(result.detail || "Unable to save print settings.", true);
            saveBtn.disabled = false;
            saveBtn.innerText = "Save & Proceed to Order Summary →";
            return;
        }

        const pendingIds = JSON.parse(localStorage.getItem("pending_file_ids") || "[]");
        if (pendingIds.length > 0) {
            const nextFileId = pendingIds.shift();
            localStorage.setItem("pending_file_ids", JSON.stringify(pendingIds));
            showStatus("Settings saved. Loading next document...");
            setTimeout(() => {
                window.location.href = `/file/settings-page/${nextFileId}`;
            }, 350);
        } else {
            localStorage.removeItem("pending_file_ids");
            showStatus("All documents configured! Loading order summary...");
            setTimeout(() => {
                window.location.href = `/file/summary/${fileId}`;
            }, 350);
        }
    } catch (err) {
        showStatus("Server connection error. Please try again.", true);
        saveBtn.disabled = false;
        saveBtn.innerText = "Save & Proceed to Order Summary →";
    }
});
</script>

</body>
</html>

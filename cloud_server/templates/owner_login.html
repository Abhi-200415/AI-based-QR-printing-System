<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Printing - Owner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #151e2e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #233044;
            --input-bg: #0f172a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        .tabs {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 44px;
        }
        .toggle-password {
            position: absolute;
            right: 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }
        .toggle-password:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .toggle-password svg {
            width: 20px;
            height: 20px;
        }
        .form-helper {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }
        .link-btn {
            background: none;
            border: none;
            color: #818cf8;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }
        .link-btn:hover {
            color: #c084fc;
            text-decoration: underline;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: var(--input-bg);
            color: var(--text);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            word-break: break-word;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <h1>AI Smart Printing</h1>
            <p class="subtitle" id="headerSubtitle">Shop Owner & Operator Portal</p>
        </div>

        <div class="tabs" id="authTabs">
            <button class="tab-btn active" id="loginTabBtn" onclick="showTab('login')">Owner Login</button>
            <button class="tab-btn" id="registerTabBtn" onclick="showTab('register')">Register Shop</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="owner@printshop.com">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div class="form-helper">
                    <button type="button" class="link-btn" onclick="showTab('forgot')">Forgot Password?</button>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="loginSubmitBtn">Log In to Dashboard</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regShopName">Shop / Business Name</label>
                <input type="text" id="regShopName" required placeholder="e.g. Apex Print Studio">
            </div>
            <div class="form-group">
                <label for="regOwnerName">Owner Full Name</label>
                <input type="text" id="regOwnerName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" required placeholder="owner@printshop.com">
            </div>
            <div class="form-group">
                <label for="regPhone">Phone Number</label>
                <input type="tel" id="regPhone" required placeholder="9876543210">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" required placeholder="At least 6 characters">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="regUpiId">UPI ID (For Customer Payments)</label>
                <input type="text" id="regUpiId" placeholder="e.g. 9876543210@upi">
            </div>
            <button type="submit" class="btn-submit" id="regSubmitBtn">Create Shop & Launch</button>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgotForm" style="display: none;" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="resetEmail">Registered Email Address</label>
                <input type="email" id="resetEmail" required placeholder="owner@printshop.com">
            </div>
            <div class="form-group">
                <label for="resetPhone">Registered Phone Number</label>
                <input type="tel" id="resetPhone" required placeholder="9876543210">
            </div>
            <div class="form-group">
                <label for="resetNewPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="resetNewPassword" required minlength="6" placeholder="At least 6 characters">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('resetNewPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="resetConfirmPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="resetConfirmPassword" required minlength="6" placeholder="Re-enter new password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('resetConfirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="resetSubmitBtn">Reset Password</button>
            <button type="button" class="btn-submit btn-secondary" onclick="showTab('login')">Back to Login</button>
        </form>

        <div id="statusAlert" class="alert"></div>
    </div>
</div>

<script>
const EYE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
const EYE_OFF_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;

    if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = EYE_OFF_ICON_SVG;
        btn.title = "Hide Password";
    } else {
        input.type = "password";
        btn.innerHTML = EYE_ICON_SVG;
        btn.title = "Show Password";
    }
}

function showTab(tab) {
    const loginForm = document.getElementById("loginForm");
    const regForm = document.getElementById("registerForm");
    const forgotForm = document.getElementById("forgotForm");
    const loginBtn = document.getElementById("loginTabBtn");
    const regBtn = document.getElementById("registerTabBtn");
    const authTabs = document.getElementById("authTabs");
    const subtitle = document.getElementById("headerSubtitle");
    const alertBox = document.getElementById("statusAlert");
    alertBox.style.display = "none";

    if (tab === "login") {
        loginForm.style.display = "block";
        regForm.style.display = "none";
        forgotForm.style.display = "none";
        authTabs.style.display = "flex";
        loginBtn.classList.add("active");
        regBtn.classList.remove("active");
        subtitle.innerText = "Shop Owner & Operator Portal";
    } else if (tab === "register") {
        loginForm.style.display = "none";
        regForm.style.display = "block";
        forgotForm.style.display = "none";
        authTabs.style.display = "flex";
        loginBtn.classList.remove("active");
        regBtn.classList.add("active");
        subtitle.innerText = "Register Your Print Shop & Set Pricing";
    } else if (tab === "forgot") {
        loginForm.style.display = "none";
        regForm.style.display = "none";
        forgotForm.style.display = "block";
        authTabs.style.display = "none";
        subtitle.innerText = "Reset Your Password";
    }
}

function showAlert(msg, isError = true) {
    const alertBox = document.getElementById("statusAlert");
    alertBox.innerText = msg;
    alertBox.className = "alert " + (isError ? "error" : "success");
    alertBox.style.display = "block";
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("loginSubmitBtn");
    btn.disabled = true;
    btn.innerText = "Signing in...";

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch("/owner/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const rawText = await res.text();
        let data = {};
        if (rawText && rawText.trim().startsWith("<")) {
            data = { detail: "Server is waking up or deploying. Please try again in 10-15 seconds." };
        } else {
            try {
                data = JSON.parse(rawText);
            } catch (jsonErr) {
                data = { detail: rawText || `Server error (${res.status})` };
            }
        }

        if (res.ok && data.owner_id) {
            localStorage.setItem("owner_token", data.access_token);
            localStorage.setItem("owner_id", data.owner_id);
            localStorage.setItem("shop_name", data.shop_name);
            showAlert("Login successful! Redirecting...", false);
            setTimeout(() => {
                window.location.href = `/owner/${data.owner_id}/dashboard`;
            }, 500);
        } else {
            let errorMsg = "Login failed. Please check your email and password.";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(d => d.msg || JSON.stringify(d)).join(", ");
            }
            showAlert(errorMsg);
            btn.disabled = false;
            btn.innerText = "Log In to Dashboard";
        }
    } catch (err) {
        showAlert("Network connection error. Please verify your internet connection or server status: " + err.message);
        btn.disabled = false;
        btn.innerText = "Log In to Dashboard";
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById("regSubmitBtn");
    btn.disabled = true;
    btn.innerText = "Registering shop...";

    const shop_name = document.getElementById("regShopName").value.trim();
    const owner_name = document.getElementById("regOwnerName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const password = document.getElementById("regPassword").value;
    const upi_id = document.getElementById("regUpiId").value.trim() || undefined;

    try {
        const res = await fetch("/owner/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ shop_name, owner_name, email, phone, password, upi_id })
        });

        const rawText = await res.text();
        let data = {};
        if (rawText && rawText.trim().startsWith("<")) {
            data = { detail: "Server is waking up or deploying. Please try again in 10-15 seconds." };
        } else {
            try {
                data = JSON.parse(rawText);
            } catch (jsonErr) {
                data = { detail: rawText || `Server error (${res.status})` };
            }
        }

        if (res.ok && data.owner_id) {
            try {
                const loginRes = await fetch("/owner/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const loginText = await loginRes.text();
                const loginData = JSON.parse(loginText);
                if (loginData.access_token) {
                    localStorage.setItem("owner_token", loginData.access_token);
                    localStorage.setItem("owner_id", data.owner_id);
                    localStorage.setItem("shop_name", data.shop_name);
                }
            } catch (loginErr) {
                console.warn("Auto-login error:", loginErr);
            }
            showAlert("Shop registered successfully! Opening dashboard...", false);
            setTimeout(() => {
                window.location.href = `/owner/${data.owner_id}/dashboard`;
            }, 600);
        } else {
            let errorMsg = "Registration failed. Please check your details.";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(d => d.msg || JSON.stringify(d)).join(", ");
            }
            showAlert(errorMsg);
            btn.disabled = false;
            btn.innerText = "Create Shop & Launch";
        }
    } catch (err) {
        showAlert("Network connection error. Please verify your internet connection or server status: " + err.message);
        btn.disabled = false;
        btn.innerText = "Create Shop & Launch";
    }
}

async function handleResetPassword(e) {
    e.preventDefault();
    const btn = document.getElementById("resetSubmitBtn");
    const email = document.getElementById("resetEmail").value.trim();
    const phone = document.getElementById("resetPhone").value.trim();
    const newPassword = document.getElementById("resetNewPassword").value;
    const confirmPassword = document.getElementById("resetConfirmPassword").value;

    if (newPassword !== confirmPassword) {
        showAlert("Passwords do not match. Please re-enter.");
        return;
    }

    if (newPassword.length < 6) {
        showAlert("Password must be at least 6 characters.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Resetting password...";

    try {
        const res = await fetch("/owner/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, phone, new_password: newPassword })
        });

        const rawText = await res.text();
        let data = {};
        if (rawText && rawText.trim().startsWith("<")) {
            data = { detail: "Server is waking up or deploying. Please try again in 10-15 seconds." };
        } else {
            try {
                data = JSON.parse(rawText);
            } catch (jsonErr) {
                data = { detail: rawText || `Server error (${res.status})` };
            }
        }

        if (res.ok) {
            showAlert("Password reset successfully! Redirecting to login...", false);
            setTimeout(() => {
                showTab("login");
                document.getElementById("loginEmail").value = email;
                document.getElementById("loginPassword").value = "";
                btn.disabled = false;
                btn.innerText = "Reset Password";
            }, 1200);
        } else {
            let errorMsg = "Failed to reset password. Please verify your email and phone number.";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(d => d.msg || JSON.stringify(d)).join(", ");
            }
            showAlert(errorMsg);
            btn.disabled = false;
            btn.innerText = "Reset Password";
        }
    } catch (err) {
        showAlert("Network connection error: " + err.message);
        btn.disabled = false;
        btn.innerText = "Reset Password";
    }
}
</script>

</body>
</html>

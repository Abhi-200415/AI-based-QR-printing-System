<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Printing - Owner Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #151e2e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #233044;
            --input-bg: #0f172a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        .tabs {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }
        .alert.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .alert.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <h1>AI Smart Printing</h1>
            <p class="subtitle">Shop Owner & Operator Portal</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="loginTabBtn" onclick="showTab('login')">Owner Login</button>
            <button class="tab-btn" id="registerTabBtn" onclick="showTab('register')">Register Shop</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="owner@printshop.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="loginSubmitBtn">Log In to Dashboard</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Shop / Business Name</label>
                <input type="text" id="regShopName" required placeholder="e.g. Apex Print Studio">
            </div>
            <div class="form-group">
                <label>Owner Full Name</label>
                <input type="text" id="regOwnerName" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" required placeholder="owner@printshop.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" required placeholder="9876543210">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label>UPI ID (For Customer Payments)</label>
                <input type="text" id="regUpiId" placeholder="e.g. 9876543210@upi">
            </div>
            <button type="submit" class="btn-submit" id="regSubmitBtn">Create Shop & Launch</button>
        </form>

        <div id="statusAlert" class="alert"></div>
    </div>
</div>

<script>
function showTab(tab) {
    const loginForm = document.getElementById("loginForm");
    const regForm = document.getElementById("registerForm");
    const loginBtn = document.getElementById("loginTabBtn");
    const regBtn = document.getElementById("registerTabBtn");
    const alertBox = document.getElementById("statusAlert");
    alertBox.style.display = "none";

    if (tab === "login") {
        loginForm.style.display = "block";
        regForm.style.display = "none";
        loginBtn.classList.add("active");
        regBtn.classList.remove("active");
    } else {
        loginForm.style.display = "none";
        regForm.style.display = "block";
        loginBtn.classList.remove("active");
        regBtn.classList.add("active");
    }
}

function showAlert(msg, isError = true) {
    const alertBox = document.getElementById("statusAlert");
    alertBox.innerText = msg;
    alertBox.className = "alert " + (isError ? "error" : "success");
    alertBox.style.display = "block";
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("loginSubmitBtn");
    btn.disabled = true;
    btn.innerText = "Signing in...";

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const res = await fetch("/owner/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const rawText = await res.text();
        let data = {};
        try {
            data = JSON.parse(rawText);
        } catch (jsonErr) {
            data = { detail: rawText || `Server error (${res.status})` };
        }

        if (res.ok && data.owner_id) {
            localStorage.setItem("owner_token", data.access_token);
            localStorage.setItem("owner_id", data.owner_id);
            localStorage.setItem("shop_name", data.shop_name);
            showAlert("Login successful! Redirecting...", false);
            setTimeout(() => {
                window.location.href = `/owner/${data.owner_id}/dashboard`;
            }, 500);
        } else {
            let errorMsg = "Login failed. Please check your email and password.";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(d => d.msg || JSON.stringify(d)).join(", ");
            }
            showAlert(errorMsg);
            btn.disabled = false;
            btn.innerText = "Log In to Dashboard";
        }
    } catch (err) {
        showAlert("Network connection error. Please verify your internet connection or server status: " + err.message);
        btn.disabled = false;
        btn.innerText = "Log In to Dashboard";
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById("regSubmitBtn");
    btn.disabled = true;
    btn.innerText = "Registering shop...";

    const shop_name = document.getElementById("regShopName").value.trim();
    const owner_name = document.getElementById("regOwnerName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const password = document.getElementById("regPassword").value;
    const upi_id = document.getElementById("regUpiId").value.trim() || undefined;

    try {
        const res = await fetch("/owner/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ shop_name, owner_name, email, phone, password, upi_id })
        });

        const rawText = await res.text();
        let data = {};
        try {
            data = JSON.parse(rawText);
        } catch (jsonErr) {
            data = { detail: rawText || `Server error (${res.status})` };
        }

        if (res.ok && data.owner_id) {
            // Automatically log in
            try {
                const loginRes = await fetch("/owner/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const loginText = await loginRes.text();
                const loginData = JSON.parse(loginText);
                if (loginData.access_token) {
                    localStorage.setItem("owner_token", loginData.access_token);
                    localStorage.setItem("owner_id", data.owner_id);
                    localStorage.setItem("shop_name", data.shop_name);
                }
            } catch (loginErr) {
                console.warn("Auto-login error:", loginErr);
            }
            showAlert("Shop registered successfully! Opening dashboard...", false);
            setTimeout(() => {
                window.location.href = `/owner/${data.owner_id}/dashboard`;
            }, 600);
        } else {
            let errorMsg = "Registration failed. Please check your details.";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(d => d.msg || JSON.stringify(d)).join(", ");
            }
            showAlert(errorMsg);
            btn.disabled = false;
            btn.innerText = "Create Shop & Launch";
        }
    } catch (err) {
        showAlert("Network connection error. Please verify your internet connection or server status: " + err.message);
        btn.disabled = false;
        btn.innerText = "Create Shop & Launch";
    }
}
</script>

</body>
</html>
